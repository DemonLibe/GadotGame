# Озвучка диспетчера: нейросетевой голос Piper (русский) + эффект рации.
# Запускается при изменении реплик (voice/lines.json) или вручную. Готовые .ogg
# коммитятся в voice/, после чего пересобирается браузерная версия.
name: Voice

on:
  workflow_dispatch:
  push:
    paths:
      - "voice/lines.json"
      - "tools/voice/**"
      - ".github/workflows/voice.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Piper and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q piper-tts==1.2.0

      - name: Download Russian voices
        run: |
          mkdir -p models
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU"
          for v in dmitri denis; do
            wget -q -O "models/ru_RU-$v-medium.onnx" "$base/$v/medium/ru_RU-$v-medium.onnx"
            wget -q -O "models/ru_RU-$v-medium.onnx.json" "$base/$v/medium/ru_RU-$v-medium.onnx.json"
          done

      - name: Generate voice lines
        run: python tools/voice/generate.py models/ru_RU-dmitri-medium.onnx models/ru_RU-denis-medium.onnx

      - name: Commit voice files
        id: commit
        run: |
          git add voice
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Озвучка диспетчера (Piper, эффект рации)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Коммит от GITHUB_TOKEN не запускает другие workflow — запускаем сборку сайта явно.
      - name: Rebuild web version
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web.yml --ref "${GITHUB_REF_NAME}"
